[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vfmstudio"
version = "0.1.0"
description = "VFM Studio — a CAE-style desktop application for the virtual fields method"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "VFM Studio contributors" },
]
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-fem>=8.0",
    "pyside6>=6.5",
    "superqt>=0.6",
    "pyvista>=0.43",
    "pyvistaqt>=0.11",
    "vtk>=9.2",
    "pyqtgraph>=0.13",
    "xarray>=2023.1",
    "pydantic>=2.0",
    "pint>=0.22",
    "h5py>=3.8",
    "meshio>=5.3",
    "tifffile>=2023.1",
    "pillow>=10.0",
    "shapely>=2.0",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-qt>=4.2",
    "ruff>=0.4",
    "mypy>=1.8",
]
packaging = [
    "pyinstaller>=6.0",
]

[project.scripts]
vfmstudio = "vfmstudio.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vfmstudio = [
    "gui/style/*.qss",
    "resources/icons/*.svg",
    "resources/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
